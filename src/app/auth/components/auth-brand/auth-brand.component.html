@if (variant() === 'compact') {
  <a class="brand mobile-brand" href="/" aria-label="Mahalat">
    <span class="brand-mark" aria-hidden="true">م</span>
    <span>Mahalat</span>
  </a>
} @else {
  <aside class="brand-panel">
    <a class="brand" href="/" aria-label="Mahalat">
      <span class="brand-mark" aria-hidden="true">م</span>
      <span>Mahalat</span>
    </a>

    <div class="brand-copy">
      <span class="eyebrow">{{ 'auth.brand.eyebrow' | transloco }}</span>
      <h1>{{ 'auth.brand.title' | transloco }}</h1>
      <p>{{ 'auth.brand.description' | transloco }}</p>
    </div>

    <div class="brand-foot">
      <span class="brand-foot-mark" aria-hidden="true">✦</span>
      <p>{{ 'auth.brand.promise' | transloco }}</p>
    </div>
  </aside>
}
