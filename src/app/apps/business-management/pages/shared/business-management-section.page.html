<ion-content class="business-management-content" [fullscreen]="true">
  <main class="business-management-main">
    @if (page() !== 'overview') {
      <section class="page-heading">
        <h1>{{ content.title | transloco }}</h1>
        <p>{{ content.description | transloco }}</p>
      </section>
    }

    @if (page() === 'overview') {
      <ng-content select="[overview-content]"></ng-content>
    } @else {
      <section class="empty-state" aria-live="polite">
        <ion-icon [icon]="pageIcon" aria-hidden="true"></ion-icon>
        <p>{{ content.emptyMessage | transloco }}</p>
        <ion-button fill="outline" [routerLink]="content.actionRoute">{{ content.actionLabel | transloco }}</ion-button>
      </section>
    }
  </main>
</ion-content>
